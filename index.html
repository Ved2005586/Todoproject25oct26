
<!DOCTYPE html>
<html>
<head>
    <title>Todo App by Vedant</title>

    <style>
        * {
            font-size: 30px;
            text-align: center;
        }

        body {
            background-color: azure;
        }

        table {
            margin: auto;
            width: 70%;
        }
    </style>
</head>

<body onload="findAll()">

    <h1>Todo App by Vedant</h1>

    <form onsubmit="save(event)">
        <label>Enter Task</label>
        <br/>

        <input
            type="text"
            id="id_task"
            placeholder="Enter Your Task"
            size="25"
        />

        <br/><br/>

        <input
            type="submit"
            id="id_btn"
            value="Save Task"
        />
    </form>

    <h2 id="id_msg"></h2>

    <br/>

    <table border="5">
        <thead>
            <tr>
                <th>Task</th>
                <th>Delete</th>
            </tr>
        </thead>

        <tbody id="id_info"></tbody>
    </table>

    <script>
        
const API_BASE_URL = "https://todo25oct26.onrender.com";

function save(event) {
    event.preventDefault();

    const taskInput = document.getElementById("id_task");
    const btn = document.getElementById("id_btn");
    const msg = document.getElementById("id_msg");

    const task = taskInput.value.trim();

    if (task === "") {
        alert("Task cannot be empty");
        taskInput.focus();
        return;
    }

    btn.disabled = true;

    fetch(`${API_BASE_URL}/save`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ task: task })
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("Failed to save task");
        }
        return response.text();
    })
    .then(data => {
        alert(data);
        taskInput.value = "";
        msg.textContent = "";
        findAll();
    })
    .catch(error => {
        msg.textContent = "Error saving task: " + error.message;
    })
    .finally(() => {
        btn.disabled = false;
    });
}

function findAll() {
    const info = document.getElementById("id_info");

    fetch(`${API_BASE_URL}/findall`)
        .then(response => {
            if (!response.ok) {
                throw new Error("Failed to fetch tasks");
            }
            return response.json();
        })
        .then(data => {
            info.innerHTML = "";

            data.forEach(item => {
                const tr = document.createElement("tr");
                const taskCell = document.createElement("td");
                const deleteCell = document.createElement("td");
                const deleteBtn = document.createElement("button");

                taskCell.textContent = item.task;
                deleteBtn.textContent = "Delete";

                deleteBtn.addEventListener("click", () => {
                    delData(item.id);
                });

                deleteCell.appendChild(deleteBtn);
                tr.appendChild(taskCell);
                tr.appendChild(deleteCell);
                info.appendChild(tr);
            });
        })
        .catch(error => {
            console.error(error);
            document.getElementById("id_msg").textContent =
                "Error loading tasks: " + error.message;
        });
}

function delData(id) {
    if (!confirm("Are you sure you want to delete this task?")) {
        return;
    }

    fetch(`${API_BASE_URL}/deletebyid/${id}`, {
        method: "DELETE"
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("Failed to delete task");
        }
        return response.text();
    })
    .then(data => {
        alert(data);
        findAll();
    })
    .catch(error => {
        alert("Error deleting task: " + error.message);
    });
}

    </script>

</body>
</html>
